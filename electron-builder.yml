appId: com.alejandrofont.meetingnotes
productName: Meeting Notes
directories:
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/icon.png
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-setup-${version}.${ext}
publish:
  provider: github
  owner: AleDev11
  repo: meeting-notes
