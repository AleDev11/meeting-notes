name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Qué ocurre
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que ocurriera
  - type: dropdown
    id: provider
    attributes:
      label: Proveedor de transcripción
      multiple: true
      options:
        - Deepgram
        - ElevenLabs
        - AssemblyAI
        - No aplica
  - type: input
    id: version
    attributes:
      label: Versión de la app
      placeholder: 0.1.0
  - type: input
    id: os
    attributes:
      label: Sistema operativo
      placeholder: Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Revisa que no incluyan API keys ni datos privados.
      render: text
